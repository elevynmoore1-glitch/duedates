<style>
:root{--bg:#f3f5f7;--ink:#101a2b;--mut:#55627a;--line:#cfd6e0;--panel:#fff;--blue:#1f3fd1;--onblue:#fff;--red:#c2321f;--amb:#9a5b00;--ok:#1f7a4d;--hd:#f3f5f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--ink:#e8edf6;--mut:#9aa8c2;--line:#27324a;--panel:#131c30;--blue:#8aa2ff;--onblue:#0d1424;--red:#ff8a73;--amb:#f0b45a;--ok:#6fd19c;--hd:#0d1424;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--ink:#e8edf6;--mut:#9aa8c2;--line:#27324a;--panel:#131c30;--blue:#8aa2ff;--onblue:#0d1424;--red:#ff8a73;--amb:#f0b45a;--ok:#6fd19c;--hd:#0d1424;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
h1,h2,h3{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;line-height:1.08;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:800}h2{font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:800}h3{font-size:1.25rem;font-weight:600}
a{color:var(--blue)}p{margin:0 0 1em;max-width:62ch}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);border-bottom:1px solid var(--line);z-index:11}
nav{display:flex;align-items:center;gap:22px;height:60px;flex-wrap:wrap}
nav .logo{font:800 1.3rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);text-decoration:none;margin-right:auto;letter-spacing:-.03em}
nav a.l{color:var(--ink);text-decoration:none;font-size:.95rem}nav a.l:hover{text-decoration:underline}
.btn{display:inline-block;background:var(--blue);color:var(--onblue);border:0;border-radius:6px;padding:12px 20px;font:600 1rem "Instrument Sans",system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;padding:64px 0 72px;align-items:start}
.hero p.lead{font-size:1.2rem;color:var(--mut)}
.ledger{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px}
.ledger h2{font-size:1rem;margin:0;padding:12px 16px;border-bottom:1.5px solid var(--ink);font-weight:600;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row.done .nm{text-decoration:line-through;color:var(--mut)}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}
.nm{font-weight:500}.sub{font-size:.85rem;color:var(--mut)}
.chip{font:600 .85rem "Instrument Sans",system-ui,sans-serif;border:1.5px solid currentColor;border-radius:4px;padding:2px 8px;white-space:nowrap}
.late{color:var(--red)}.soon{color:var(--amb)}.fine{color:var(--ok)}.dn{color:var(--mut)}
.add{display:flex;gap:8px;padding:12px 16px;border-top:1.5px solid var(--ink);flex-wrap:wrap}
.add input{flex:1 1 140px;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.hint{padding:0 16px 12px;font-size:.85rem;color:var(--mut)}
section{padding:56px 0;border-top:1px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--ink);border-radius:6px;background:var(--panel)}
.cols>div{padding:24px;border-right:1px solid var(--line)}.cols>div:last-child{border-right:0}
.price{font:800 2.6rem "Bricolage Grotesque",system-ui,sans-serif}.price small{font:400 1rem "Instrument Sans",system-ui,sans-serif;color:var(--mut)}
ul.t{padding-left:1.1em;margin:0 0 1.2em}ul.t li{margin-bottom:.35em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
details{border-top:1px solid var(--line);padding:14px 0}details:last-of-type{border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:600}
.note{margin-top:16px;padding:12px 16px;border-left:4px solid var(--blue);background:var(--panel);display:none}
.doc{max-width:720px;padding:48px 0 72px}.doc h2{font-size:1.4rem;margin-top:1.6em}
footer{border-top:1px solid var(--line);padding:28px 0 40px;font-size:.9rem;color:var(--mut)}
footer a{color:var(--mut);margin-right:16px}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.cols>div{border-right:0;border-bottom:1px solid var(--line)}.cols>div:last-child{border-bottom:0}.hero{padding-top:36px}}
@media(prefers-reduced-motion:no-preference){.row{transition:background .2s}.row:hover{background:var(--bg)}}

<script>
// ---- Settings: paste your Paddle checkout links here after setup (see instructions). Empty = early-access message.
var CHECKOUT={starter:"",business:"",accountant:""};
var EMAIL="elevynmoore1@gmail.com";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var day=86400000,today=new Date();today.setHours(0,0,0,0);
function iso(n){var d=new Date(today.getTime()+n*day);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var items=[{n:"Trade license renewal",d:iso(5),x:0},{n:"Quarterly sales tax filing",d:iso(19),x:0},{n:"Fire safety certificate",d:iso(-3),x:0},{n:"Business insurance renewal",d:iso(64),x:1}];
function left(d){var p=d.split("-");return Math.round((new Date(p[0],p[1]-1,p[2])-today)/day)}
function chip(i){if(i.x)return'<span class="chip dn">Done</span>';var l=left(i.d);if(l<0)return'<span class="chip late">'+(-l)+" days overdue</span>";if(l===0)return'<span class="chip late">Due today</span>';if(l<=30)return'<span class="chip soon">'+l+" days left</span>";return'<span class="chip fine">'+l+" days left</span>"}
function ledger(){var s=items.map(function(a,k){return{a:a,k:k}}).sort(function(p,q){return p.a.x-q.a.x||left(p.a.d)-left(q.a.d)});
var rows=s.map(function(o){var a=o.a;return'<div class="row'+(a.x?" done":"")+'"><input type="checkbox" data-k="'+o.k+'" aria-label="Mark '+esc(a.n)+' done"'+(a.x?" checked":"")+'><div><div class="nm">'+esc(a.n)+'</div><div class="sub">Due '+esc(a.d)+"</div></div>"+chip(a)+"</div>"}).join("");
var open=items.filter(function(a){return!a.x}).length;
return'<div class="ledger" id="ledger"><h2><span>Your deadlines</span><span>'+open+" open</span></h2>"+(rows||'<p class="hint">Nothing tracked yet. Add your first deadline below.</p>')+'<form class="add" id="addf"><input id="nn" placeholder="e.g. Annual return" aria-label="Obligation name" required maxlength="80"><input id="nd" type="date" aria-label="Due date" required><button class="btn" type="submit">Add deadline</button></form><p class="hint" id="err" role="alert"></p></div>'}
function plans(){return'<div class="cols"><div><h3>Starter</h3><div class="price">$9<small>/month</small></div><ul class="t"><li>1 user</li><li>Up to 25 deadlines</li><li>Email reminders</li><li>Plain-language guides</li></ul><button class="btn o" data-plan="starter">Choose Starter</button></div><div><h3>Business</h3><div class="price">$29<small>/month</small></div><ul class="t"><li>Up to 5 users</li><li>Unlimited deadlines</li><li>Document vault</li><li>Escalation to a teammate</li><li>Calendar feed</li></ul><button class="btn" data-plan="business">Choose Business</button></div><div><h3>Accountant</h3><div class="price">$79<small>/month</small></div><ul class="t"><li>Up to 50 client businesses</li><li>One login for all clients</li><li>Client-ready exports</li><li>View-only client access</li></ul><button class="btn o" data-plan="accountant">Choose Accountant</button></div></div><div class="note" id="note" role="status"></div>'}
var P={
"":{t:"DueDates: Compliance and Deadline Tracker for Small Businesses",d:"Track every license, tax filing and renewal in one place. DueDates sends reminders with plain-language steps so small businesses never miss a deadline.",h:function(){return'<div class="hero"><div><h1>Miss no deadline that can cost you money.</h1><p class="lead">DueDates keeps every license, tax filing, renewal and certification in one ledger, and tells you in plain words what to do before each one is due.</p><p><a class="btn" href="#/pricing">Start free trial</a> &nbsp; <a class="btn o" href="#/features">See what it does</a></p><p class="sub">Works for any country and any kind of small business.</p></div>'+ledger()+'</div><section><div class="two"><div><h2>Late fees are avoidable.</h2><p>Most missed renewals are not forgotten on purpose. They live in someone\'s inbox, a spreadsheet, or a drawer. DueDates puts them in one place that reminds you early and keeps reminding until it is marked done.</p></div><div><h3>What you get</h3><ul class="t"><li>Reminders at 60, 30, 7 and 1 days before each date</li><li>A short guide for every item: who must file, what to bring, what happens if you are late</li><li>A place to attach the certificate or receipt</li><li>Teammates get the reminder if you do not act</li></ul></div></div></section><section><h2>Common questions</h2>'+faq()+"</section>"}},
features:{t:"Features: Deadline Reminders, Document Vault and Team Alerts | DueDates",d:"See how DueDates tracks licenses, tax filings and renewals with escalating reminders, a document vault, team roles and an accountant mode.",h:function(){return'<div class="doc"><h1>Features</h1><h2>Deadline ledger</h2><p>Add any obligation with a due date and repeat schedule. Everything is sorted by what is most urgent, with overdue items first.</p><h2>Reminders that escalate</h2><p>Email reminders arrive at 60, 30, 7 and 1 days before the date. If nobody marks the item done, a teammate you choose is notified.</p><h2>Plain-language guides</h2><p>Each item explains what it is, who needs it, what to prepare and what a late filing usually leads to. Guides are summaries. Confirm details with the issuing authority.</p><h2>Document vault</h2><p>Attach the certificate, filing receipt or renewal letter to the item it belongs to, so proof is ready for an audit.</p><h2>Team roles</h2><p>Owners, managers and view-only members, so an accountant can see dates without changing them.</p><h2>Accountant mode</h2><p>Manage many client businesses under one login and export a status report for each.</p><h2>Calendar feed and exports</h2><p>Subscribe from Google or Outlook calendar, or export a CSV or PDF at any time.</p><p><a class="btn" href="#/pricing">See pricing</a></p></div>'}},
pricing:{t:"Pricing: Plans from $9 per Month | DueDates",d:"Simple monthly plans for solo owners, small teams and accountants. Cancel anytime, 14-day refund on your first payment.",h:function(){return'<div class="doc" style="max-width:none"><h1>Simple monthly pricing</h1><p>Every plan starts with a free trial. Cancel anytime from your billing page. Prices are in US dollars, and any sales tax or VAT is calculated at checkout.</p>'+plans()+'<section><h2>Questions about billing</h2><p>Payments are handled by our payment partner, which acts as the seller and issues your receipt. We never see your card number. If a payment fails, we retry it and email you before anything is paused. Questions: <a href="mailto:'+EMAIL+'">'+EMAIL+"</a>.</p></section></div>"}},
security:{t:"Security: How DueDates Protects Your Data",d:"How DueDates isolates business data, encrypts connections, validates input and keeps card details off our servers.",h:function(){return'<div class="doc"><h1>Security</h1><p>No online service can promise zero risk. These are the measures we design and build around.</p><ul class="t"><li>Every business\'s records are separated at the database level, so one account cannot read another\'s.</li><li>All traffic uses HTTPS. Passwords are never stored in readable form, and two-step sign-in is available.</li><li>Database queries are parameterized and all user input is validated and escaped, which blocks SQL injection and script injection.</li><li>Uploads are checked for type and size and stored privately.</li><li>Sign-in and form endpoints are rate limited.</li><li>Card payments are processed by our payment partner. Card numbers never reach our systems.</li><li>Payment status changes are accepted only from verified, signed notifications.</li><li>Backups run automatically and secrets are kept out of source code.</li></ul><p>Found a vulnerability? Please email <a href="mailto:'+EMAIL+'">'+EMAIL+"</a> with the details. We will reply and fix confirmed issues quickly.</p></div>"}},
contact:{t:"Contact DueDates",d:"Questions about DueDates, billing or your data? Email us and we will reply within two business days.",h:function(){return'<div class="doc"><h1>Contact</h1><p>Email <a href="mailto:'+EMAIL+'">'+EMAIL+"</a> for support, billing questions, data requests or security reports. We reply within two business days.</p></div>"}},
privacy:{t:"Privacy Policy | DueDates",d:"What data DueDates collects, why, who processes it and how you can access or delete it.",h:function(){return'<div class="doc"><h1>Privacy Policy</h1><p class="sub">Last updated October 16, 2026</p><h2>What we collect</h2><p>Your email and sign-in details, the obligations and dates you enter, documents you upload, team members you invite, and basic usage and error logs. Payment details are collected by our payment partner, not by us.</p><h2>Why we use it</h2><p>To run the service, send the reminders you set, provide support, keep the service secure and meet legal duties. We do not sell your data and we do not use it for third-party advertising.</p><h2>Who processes it</h2><p>Service providers that host our app, store data, send email, process payments and power the assistant. They may act only on our instructions. Questions you ask the assistant may be processed by an AI provider to produce an answer.</p><h2>Retention</h2><p>We keep your data while your account is active. After you delete it, data is removed from live systems and then from backups within a reasonable period, unless the law requires us to keep records.</p><h2>Your rights</h2><p>You may ask to access, correct, export or delete your data, and to object to or restrict processing where the law gives you that right. Email <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>.</p><h2>Children</h2><p>DueDates is for businesses and is not directed to children.</p><h2>Changes</h2><p>If we change this policy in a meaningful way, we will notify you before it takes effect.</p></div>'}},
terms:{t:"Terms of Service | DueDates",d:"The terms for using DueDates: accounts, acceptable use, billing, cancellation and liability.",h:function(){return'<div class="doc"><h1>Terms of Service</h1><p class="sub">Last updated October 16, 2026</p><h2>The service</h2><p>DueDates helps you track deadlines and gives plain-language summaries of obligations. It is not legal, tax or accounting advice. Rules change and differ by place, so confirm requirements with the issuing authority or a qualified professional. You are responsible for meeting your deadlines.</p><h2>Reminders</h2><p>We aim to send reminders on time but cannot guarantee delivery, since email and networks can fail. Do not rely on DueDates as your only safeguard for critical dates.</p><h2>Your account</h2><p>Keep your sign-in secure and give us accurate information. You are responsible for activity under your account and for the data you upload.</p><h2>Acceptable use</h2><p>Do not break the law, attack or probe the service, upload malware, or resell access without permission.</p><h2>Billing</h2><p>Plans renew monthly until cancelled. Our payment partner acts as merchant of record and handles payment, tax and receipts. If a payment fails, we retry and may pause paid features after notice.</p><h2>Cancellation and refunds</h2><p>Cancel any time. Access continues to the end of the paid period. See the Refund Policy.</p><h2>Liability</h2><p>To the extent the law allows, the service is provided as is, and our total liability is limited to the amount you paid in the 12 months before the claim. We are not liable for penalties, fines or lost profits resulting from missed deadlines.</p><h2>Changes and contact</h2><p>We may update these terms and will give notice of material changes. Contact: <a href="mailto:'+EMAIL+'">'+EMAIL+"</a>.</p></div>"}},
refunds:{t:"Refund Policy | DueDates",d:"DueDates offers a 14-day refund on your first payment and lets you cancel anytime.",h:function(){return'<div class="doc"><h1>Refund Policy</h1><p class="sub">Last updated October 16, 2026</p><p>If DueDates is not right for you, email <a href="mailto:'+EMAIL+'">'+EMAIL+'</a> within 14 days of your first payment and we will refund it in full. Refunds go back to the original payment method through our payment partner and can take several business days to appear.</p><p>After that period, you can cancel at any time to stop future charges. We do not refund partial months already used, except where the law requires it. If you were charged twice or in error, tell us and we will correct it.</p></div>'}},
cookies:{t:"Cookie Policy | DueDates",d:"DueDates uses only essential storage to keep you signed in and remember settings. No advertising trackers.",h:function(){return'<div class="doc"><h1>Cookie Policy</h1><p class="sub">Last updated October 16, 2026</p><p>DueDates uses only essential cookies and similar storage to keep you signed in, protect forms from forgery, and remember basic preferences. We do not use advertising or cross-site tracking cookies. If we add analytics later, we will ask for your consent where the law requires it and update this page.</p></div>'}}
};
function faq(){return[["Does DueDates give legal or tax advice?","No. It tracks dates and explains what an obligation usually involves. Always confirm requirements with the issuing authority or a professional."],["Which countries does it cover?","You can track any obligation anywhere. Built-in guides are added region by region."],["Can I cancel anytime?","Yes. Cancel from your billing page and keep access until the end of the paid period."],["Is my data safe?","Each business's data is isolated, connections are encrypted, and card details never touch our servers. Read the Security page for details."]].map(function(q){return"<details><summary>"+q[0]+"</summary><p>"+q[1]+"</p></details>"}).join("")}
function route(){var r=(location.hash.replace(/^#\/?/,"")||"");var p=P[r]||P[""];document.title=p.t;var m=document.querySelector('meta[name="description"]');if(m)m.setAttribute("content",p.d);$("#app").innerHTML=p.h();window.scrollTo(0,0)}
document.addEventListener("click",function(e){var t=e.target;if(t.matches&&t.matches("input[data-k]")){items[+t.dataset.k].x=t.checked?1:0;redraw()}
if(t.dataset&&t.dataset.plan){var u=CHECKOUT[t.dataset.plan],n=$("#note");if(u){location.href=u}else if(n){n.style.display="block";n.innerHTML="Checkout opens at launch. Email <a href=\"mailto:"+EMAIL+"?subject=DueDates%20early%20access\">"+EMAIL+"</a> and we will send you early access."}}});
document.addEventListener("submit",function(e){if(e.target.id!=="addf")return;e.preventDefault();var n=$("#nn").value.trim(),d=$("#nd").value,er=$("#err");if(!n||!d){er.textContent="Enter a name and a due date to add a deadline.";return}items.push({n:n.slice(0,80),d:d,x:0});redraw()});
function redraw(){var l=$("#ledger");if(l){var w=document.createElement("div");w.innerHTML=ledger();l.replaceWith(w.firstChild)}}
window.addEventListener("hashchange",route);route();
</script>
